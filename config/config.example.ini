; Copy to config/config.ini for local overrides. Non-secret settings only —
; database credentials belong in .env, not here (see .env.example).

[ingestion]
batch_size = 10000

[reconciliation]
default_algorithm = hash        ; brute_force | two_pointer | hash | sql
amount_tolerance_cents = 0      ; e.g. 2 = allow up to 2 cents difference
matching_strategy = exact_id    ; exact_id | composite_key

[logging]
level = INFO                    ; INFO | WARN | ERROR
